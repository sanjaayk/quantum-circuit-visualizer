name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt && pip install -e .
      - run: pytest -q
      - name: Make sure no API keys were committed
        run: |
          if grep -rIEn "token\s*=\s*['\"][A-Za-z0-9_-]{30,}['\"]" --include="*.py" --include="*.ipynb" .; then
            echo "Possible hard-coded IBM Quantum token found"; exit 1; fi
